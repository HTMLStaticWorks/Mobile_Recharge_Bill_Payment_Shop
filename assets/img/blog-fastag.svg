<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Illustration of a car passing a toll gantry with its FASTag balance being deducted">
  <defs>
    <linearGradient id="bfBg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#EA580C"/>
      <stop offset="0.55" stop-color="#C2410C"/>
      <stop offset="1" stop-color="#7C2D12"/>
    </linearGradient>
    <linearGradient id="bfRoad" x1="0" y1="330" x2="640" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="bfBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <filter id="bfCard" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#431407" flood-opacity="0.42"/>
    </filter>
    <clipPath id="bfClip"><rect width="640" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#bfClip)">
    <rect width="640" height="400" fill="url(#bfBg)"/>
    <g filter="url(#bfBlur)" opacity="0.5">
      <circle cx="540" cy="80" r="118" fill="#FBBF24"/>
      <circle cx="90" cy="330" r="112" fill="#F97316"/>
    </g>
    <g opacity="0.13" stroke="#FFFFFF">
      <path d="M0 96h640M0 152h640"/>
      <circle cx="320" cy="180" r="150"/>
    </g>

    <!-- Toll gantry -->
    <g fill="#FFFFFF" opacity="0.92">
      <rect x="92" y="96" width="26" height="204" rx="8"/>
      <rect x="522" y="96" width="26" height="204" rx="8"/>
      <rect x="92" y="96" width="456" height="30" rx="12"/>
    </g>
    <rect x="286" y="126" width="68" height="30" rx="10" fill="#FFFFFF" opacity="0.92"/>
    <circle cx="320" cy="141" r="7" fill="#EA580C"/>

    <!-- Signal waves from the reader -->
    <g stroke="#FBBF24" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M300 178a28 28 0 0 1 40 0" opacity="0.85"/>
      <path d="M288 198a46 46 0 0 1 64 0" opacity="0.55"/>
      <path d="M276 218a64 64 0 0 1 88 0" opacity="0.3"/>
    </g>

    <!-- Road -->
    <rect x="0" y="326" width="640" height="6" rx="3" fill="url(#bfRoad)"/>

    <!-- Car -->
    <g filter="url(#bfCard)">
      <path d="M196 300v-30a14 14 0 0 1 14-14h22l24-30a18 18 0 0 1 14-7h48a18 18 0 0 1 14 7l24 30h22a14 14 0 0 1 14 14v30z" fill="#FFFFFF"/>
    </g>
    <path d="M246 256l18-23a10 10 0 0 1 8-4h20v27z" fill="#FDBA74"/>
    <path d="M302 256v-27h20a10 10 0 0 1 8 4l18 23z" fill="#FDBA74"/>
    <circle cx="246" cy="300" r="22" fill="#1F2937"/>
    <circle cx="246" cy="300" r="9" fill="#FFFFFF"/>
    <circle cx="368" cy="300" r="22" fill="#1F2937"/>
    <circle cx="368" cy="300" r="9" fill="#FFFFFF"/>

    <!-- Balance card -->
    <g filter="url(#bfCard)">
      <rect x="404" y="196" width="196" height="112" rx="24" fill="#FFFFFF"/>
    </g>
    <rect x="428" y="220" width="66" height="9" rx="4.5" fill="#E2E8F0"/>
    <text x="428" y="264" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="28" font-weight="500" fill="#0F172A">&#8377;420</text>
    <rect x="428" y="280" width="148" height="10" rx="5" fill="#F1F5F9"/>
    <rect x="428" y="280" width="46" height="10" rx="5" fill="#EA580C"/>
    <circle cx="556" cy="234" r="18" fill="#FFEDD5"/>
    <path d="M556 226v10" stroke="#EA580C" stroke-width="4" stroke-linecap="round"/>
    <circle cx="556" cy="243" r="2.5" fill="#EA580C"/>
  </g>
</svg>
