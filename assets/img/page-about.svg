<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Illustration of the ZapPay counter with a customer being served">
  <defs>
    <linearGradient id="paBg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="paCounter" x1="150" y1="250" x2="490" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#E0E7FF" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="paBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="paClip"><rect width="640" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#paClip)">
    <rect width="640" height="400" fill="url(#paBg)"/>
    <g filter="url(#paBlur)" opacity="0.5">
      <circle cx="104" cy="96" r="110" fill="#A5B4FC"/>
      <circle cx="558" cy="300" r="118" fill="#34D399"/>
    </g>
    <g opacity="0.13" stroke="#FFFFFF">
      <path d="M0 100h640M0 200h640M0 300h640M160 0v400M320 0v400M480 0v400"/>
    </g>

    <!-- Shop awning + signboard -->
    <rect x="150" y="52" width="340" height="46" rx="14" fill="#FFFFFF" opacity="0.18"/>
    <path d="M164 74l24 22h-24zM212 74l24 22h-24zM260 74l24 22h-24zM308 74l24 22h-24zM356 74l24 22h-24zM404 74l24 22h-24zM452 74l24 22h-24z" fill="#FFFFFF" opacity="0.12"/>
    <g>
      <rect x="252" y="60" width="136" height="30" rx="10" fill="#FFFFFF" opacity="0.92"/>
      <path d="M282 68l-9 13h6l-2 10 10-14h-7z" fill="#4F46E5"/>
      <rect x="298" y="70" width="72" height="10" rx="5" fill="#312E81" opacity="0.55"/>
    </g>

    <!-- Counter -->
    <rect x="150" y="252" width="340" height="96" rx="20" fill="url(#paCounter)"/>
    <rect x="150" y="252" width="340" height="16" rx="8" fill="#C7D2FE" opacity="0.8"/>

    <!-- Staff behind counter -->
    <g>
      <circle cx="232" cy="188" r="28" fill="#FBBF24"/>
      <path d="M232 168a20 20 0 0 1 20 16c-14 4-26 4-40 0a20 20 0 0 1 20-16z" fill="#4C1D95" opacity="0.75"/>
      <path d="M190 252c0-25 19-40 42-40s42 15 42 40z" fill="#4F46E5"/>
    </g>

    <!-- Customer in front -->
    <g>
      <circle cx="412" cy="196" r="26" fill="#F9A8D4"/>
      <path d="M412 178a18 18 0 0 1 18 15c-12 4-24 4-36 0a18 18 0 0 1 18-15z" fill="#1E1B4B" opacity="0.7"/>
      <path d="M374 252c0-23 17-36 38-36s38 13 38 36z" fill="#22D3EE" opacity="0.85"/>
    </g>

    <!-- Receipt / terminal on counter -->
    <g>
      <rect x="286" y="212" width="70" height="46" rx="12" fill="#0B1020" opacity="0.75"/>
      <rect x="294" y="220" width="54" height="22" rx="6" fill="#A5B4FC"/>
      <circle cx="304" cy="250" r="4" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="320" cy="250" r="4" fill="#FFFFFF" opacity="0.7"/>
      <circle cx="336" cy="250" r="4" fill="#FFFFFF" opacity="0.7"/>
    </g>

    <!-- Since / trust chips -->
    <g>
      <rect x="60" y="292" width="128" height="46" rx="16" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="86" cy="315" r="13" fill="#4F46E5"/>
      <path d="M80 315l4 4 8-9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="108" y="306" width="58" height="7" rx="3.5" fill="#312E81" opacity="0.6"/>
      <rect x="108" y="319" width="36" height="6" rx="3" fill="#312E81" opacity="0.35"/>
    </g>
    <g>
      <rect x="452" y="132" width="130" height="60" rx="18" fill="#FFFFFF" opacity="0.16"/>
      <g fill="#FBBF24">
        <circle cx="474" cy="152" r="5"/><circle cx="490" cy="152" r="5"/><circle cx="506" cy="152" r="5"/><circle cx="522" cy="152" r="5"/><circle cx="538" cy="152" r="5"/>
      </g>
      <rect x="474" y="168" width="86" height="7" rx="3.5" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>
</svg>
