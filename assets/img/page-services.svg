<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Illustration of a phone surrounded by recharge and bill payment services">
  <defs>
    <linearGradient id="psBg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4338CA"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="psScreen" x1="268" y1="96" x2="372" y2="330" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEF2FF"/>
    </linearGradient>
    <linearGradient id="psMint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <filter id="psBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="psClip"><rect width="640" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#psClip)">
    <rect width="640" height="400" fill="url(#psBg)"/>
    <g filter="url(#psBlur)" opacity="0.55">
      <circle cx="96" cy="86" r="112" fill="#818CF8"/>
      <circle cx="566" cy="332" r="118" fill="#10B981"/>
      <circle cx="540" cy="70" r="80" fill="#C4B5FD"/>
    </g>
    <g opacity="0.14" stroke="#FFFFFF">
      <path d="M0 100h640M0 200h640M0 300h640M160 0v400M320 0v400M480 0v400"/>
    </g>

    <!-- Orbit rings -->
    <g opacity="0.22">
      <circle cx="320" cy="200" r="164" stroke="#FFFFFF"/>
      <circle cx="320" cy="200" r="124" stroke="#FFFFFF"/>
    </g>

    <!-- Phone -->
    <rect x="258" y="86" width="124" height="250" rx="26" fill="#0B1020" opacity="0.55"/>
    <rect x="264" y="92" width="112" height="238" rx="22" fill="url(#psScreen)"/>
    <rect x="300" y="100" width="40" height="7" rx="3.5" fill="#0B1020" opacity="0.35"/>
    <rect x="278" y="122" width="84" height="52" rx="12" fill="#4F46E5" opacity="0.14"/>
    <text x="320" y="155" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#4338CA">&#8377;499</text>
    <rect x="278" y="188" width="60" height="8" rx="4" fill="#4338CA" opacity="0.3"/>
    <rect x="278" y="206" width="44" height="6" rx="3" fill="#4338CA" opacity="0.2"/>
    <rect x="278" y="228" width="84" height="10" rx="5" fill="#4338CA" opacity="0.14"/>
    <rect x="278" y="248" width="84" height="10" rx="5" fill="#4338CA" opacity="0.14"/>
    <rect x="278" y="284" width="84" height="26" rx="13" fill="#4F46E5"/>
    <path d="M306 297h20m-6-6 6 6-6 6" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Service chips: mobile, DTH, electricity, water -->
    <g>
      <rect x="72" y="118" width="120" height="56" rx="18" fill="#FFFFFF" opacity="0.16"/>
      <rect x="92" y="134" width="24" height="24" rx="7" fill="#FFFFFF" opacity="0.85"/>
      <rect x="99" y="139" width="10" height="14" rx="2" fill="#4338CA"/>
      <rect x="126" y="138" width="50" height="7" rx="3.5" fill="#FFFFFF" opacity="0.7"/>
      <rect x="126" y="152" width="32" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
    </g>
    <g>
      <rect x="52" y="228" width="120" height="56" rx="18" fill="#FFFFFF" opacity="0.16"/>
      <rect x="72" y="244" width="24" height="24" rx="7" fill="#FFFFFF" opacity="0.85"/>
      <rect x="77" y="250" width="14" height="10" rx="2" fill="#4338CA"/>
      <rect x="106" y="248" width="50" height="7" rx="3.5" fill="#FFFFFF" opacity="0.7"/>
      <rect x="106" y="262" width="32" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
    </g>
    <g>
      <rect x="452" y="98" width="120" height="56" rx="18" fill="#FFFFFF" opacity="0.16"/>
      <rect x="472" y="114" width="24" height="24" rx="7" fill="#FFFFFF" opacity="0.85"/>
      <path d="M485 119l-5 8h5l-2 6 6-8h-5z" fill="#F59E0B"/>
      <rect x="506" y="118" width="50" height="7" rx="3.5" fill="#FFFFFF" opacity="0.7"/>
      <rect x="506" y="132" width="32" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
    </g>
    <g>
      <rect x="470" y="216" width="120" height="56" rx="18" fill="#FFFFFF" opacity="0.16"/>
      <rect x="490" y="232" width="24" height="24" rx="7" fill="#FFFFFF" opacity="0.85"/>
      <path d="M502 237c4 5 6 8 6 10a6 6 0 0 1-12 0c0-2 2-5 6-10z" fill="#38BDF8"/>
      <rect x="524" y="236" width="50" height="7" rx="3.5" fill="#FFFFFF" opacity="0.7"/>
      <rect x="524" y="250" width="32" height="6" rx="3" fill="#FFFFFF" opacity="0.45"/>
    </g>

    <!-- Paid badge -->
    <g>
      <rect x="392" y="284" width="132" height="46" rx="16" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="418" cy="307" r="13" fill="url(#psMint)"/>
      <path d="M412 307l4 4 8-9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="440" y="298" width="62" height="7" rx="3.5" fill="#312E81" opacity="0.6"/>
      <rect x="440" y="311" width="40" height="6" rx="3" fill="#312E81" opacity="0.35"/>
