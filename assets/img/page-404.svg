<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" fill="none" role="img" aria-label="Illustration of a disconnected plug and a lost signal">
  <defs>
    <linearGradient id="p4Bg" x1="0" y1="0" x2="640" y2="400" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3730A3"/>
      <stop offset="0.55" stop-color="#5B21B6"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="p4Plug" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DDD6FE"/>
    </linearGradient>
    <filter id="p4Blur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="46"/>
    </filter>
    <clipPath id="p4Clip"><rect width="640" height="400"/></clipPath>
  </defs>
  <g clip-path="url(#p4Clip)">
    <rect width="640" height="400" fill="url(#p4Bg)"/>
    <g filter="url(#p4Blur)" opacity="0.5">
      <circle cx="106" cy="112" r="112" fill="#818CF8"/>
      <circle cx="548" cy="308" r="112" fill="#F472B6"/>
    </g>
    <g opacity="0.13" stroke="#FFFFFF">
      <path d="M0 100h640M0 200h640M0 300h640M160 0v400M320 0v400M480 0v400"/>
    </g>

    <!-- 404 ghost text -->
    <text x="320" y="240" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="188" font-weight="800" fill="#FFFFFF" opacity="0.1">404</text>

    <!-- Left socket + cable -->
    <g>
      <path d="M96 200h96" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round"/>
      <path d="M60 200c-22 0-22 34-44 34" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
      <rect x="192" y="170" width="60" height="60" rx="18" fill="url(#p4Plug)"/>
      <circle cx="214" cy="192" r="6" fill="#4338CA"/>
      <circle cx="230" cy="192" r="6" fill="#4338CA"/>
      <rect x="208" y="208" width="28" height="7" rx="3.5" fill="#4338CA" opacity="0.5"/>
    </g>

    <!-- Right plug + cable -->
    <g>
      <path d="M448 200h96" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="10" stroke-linecap="round"/>
      <path d="M580 200c22 0 22-34 44-34" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="10" stroke-linecap="round"/>
      <path d="M388 176h44a16 16 0 0 1 16 16v16a16 16 0 0 1-16 16h-44z" fill="url(#p4Plug)"/>
      <rect x="368" y="182" width="20" height="10" rx="5" fill="#C7D2FE"/>
      <rect x="368" y="208" width="20" height="10" rx="5" fill="#C7D2FE"/>
    </g>

    <!-- Disconnect spark -->
    <g opacity="0.95">
      <path d="M310 168l-22 32h18l-8 30 30-38h-20z" fill="#FBBF24"/>
      <path d="M282 148l-12 12M356 150l12 12M276 244l-14 10M362 246l14 10" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" opacity="0.6"/>
    </g>

    <!-- Lost-signal chip -->
    <g>
      <rect x="196" y="300" width="248" height="52" rx="18" fill="#FFFFFF" opacity="0.95"/>
      <circle cx="226" cy="326" r="14" fill="#F87171"/>
      <path d="M221 321l10 10M231 321l-10 10" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
      <rect x="252" y="314" width="150" height="8" rx="4" fill="#312E81" opacity="0.55"/>
      <rect x="252" y="330" width="96" height="7" rx="3.5" fill="#312E81" opacity="0.32"/>
    </g>
  </g>
</svg>
