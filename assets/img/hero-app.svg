<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" fill="none" role="img" aria-labelledby="zpHeroTitle">
  <title id="zpHeroTitle">The ZapPay app confirming an instant mobile recharge</title>
  <defs>
    <linearGradient id="zpBrand" x1="176" y1="38" x2="384" y2="602" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366F1"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="zpHead" x1="184" y1="46" x2="376" y2="254" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="zpMint" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="zpAmber" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="zpBlur" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="42"/>
    </filter>
    <filter id="zpCard" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1E1B4B" flood-opacity="0.16"/>
    </filter>
    <filter id="zpDeep" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#1E1B4B" flood-opacity="0.30"/>
    </filter>
    <clipPath id="zpScreen">
      <rect x="184" y="46" width="192" height="548" rx="30"/>
    </clipPath>
  </defs>

  <!-- Ambient light -->
  <g filter="url(#zpBlur)" opacity="0.5">
    <circle cx="128" cy="158" r="94" fill="#818CF8"/>
    <circle cx="456" cy="474" r="102" fill="#34D399"/>
    <circle cx="430" cy="120" r="72" fill="#C4B5FD"/>
    <circle cx="120" cy="500" r="72" fill="#A5B4FC"/>
  </g>

  <!-- Phone -->
  <g filter="url(#zpDeep)">
    <rect x="176" y="38" width="208" height="564" rx="40" fill="#0B1020"/>
  </g>
  <rect x="176.75" y="38.75" width="206.5" height="562.5" rx="39.25" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>

  <g clip-path="url(#zpScreen)">
    <rect x="184" y="46" width="192" height="548" fill="#F8FAFC"/>

    <!-- Header -->
    <rect x="184" y="46" width="192" height="212" fill="url(#zpHead)"/>
    <circle cx="372" cy="66" r="62" fill="#FFFFFF" opacity="0.10"/>
    <circle cx="192" cy="224" r="48" fill="#FFFFFF" opacity="0.08"/>

    <!-- Status bar -->
    <rect x="200" y="62" width="24" height="6" rx="3" fill="#FFFFFF" opacity="0.7"/>
    <rect x="332" y="62" width="28" height="6" rx="3" fill="#FFFFFF" opacity="0.55"/>
    <rect x="258" y="56" width="44" height="10" rx="5" fill="#0B1020"/>

    <!-- Success mark -->
    <circle cx="280" cy="112" r="24" fill="#FFFFFF" opacity="0.18"/>
    <circle cx="280" cy="112" r="17" fill="url(#zpMint)"/>
    <path d="M272.5 112.5l5 5 10.5-10.5" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="280" y="172" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="34" font-weight="500" fill="#FFFFFF">&#8377;499</text>
    <text x="280" y="196" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#FFFFFF" opacity="0.85">Recharged in 2 seconds</text>
    <rect x="242" y="212" width="76" height="7" rx="3.5" fill="#FFFFFF" opacity="0.35"/>

    <!-- Receipt card -->
    <g filter="url(#zpCard)">
      <rect x="196" y="240" width="168" height="104" rx="18" fill="#FFFFFF"/>
    </g>
    <rect x="212" y="258" width="36" height="36" rx="12" fill="#EEF2FF"/>
    <path d="M230 268v16M224 276h12" stroke="#6366F1" stroke-width="2.4" stroke-linecap="round"/>
    <rect x="258" y="264" width="62" height="8" rx="4" fill="#DDE3EE"/>
    <rect x="258" y="280" width="42" height="6" rx="3" fill="#EAEEF5"/>
    <rect x="326" y="266" width="22" height="8" rx="4" fill="#C7D2FE"/>
    <rect x="212" y="308" width="136" height="1" fill="#EEF1F6"/>
    <circle cx="217" cy="324" r="5" fill="#10B981"/>
    <rect x="230" y="320" width="66" height="7" rx="3.5" fill="#DDE3EE"/>

    <!-- Quick actions -->
    <rect x="196" y="366" width="54" height="7" rx="3.5" fill="#D6DCE7"/>
    <rect x="196" y="384" width="36" height="36" rx="12" fill="#EEF2FF"/>
    <circle cx="214" cy="402" r="7" fill="#6366F1"/>
    <rect x="240" y="384" width="36" height="36" rx="12" fill="#ECFDF5"/>
    <circle cx="258" cy="402" r="7" fill="#10B981"/>
    <rect x="284" y="384" width="36" height="36" rx="12" fill="#FEF3C7"/>
    <circle cx="302" cy="402" r="7" fill="#F59E0B"/>
    <rect x="328" y="384" width="36" height="36" rx="12" fill="#F1F5F9"/>
    <circle cx="346" cy="402" r="7" fill="#94A3B8"/>
    <rect x="200" y="428" width="28" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="244" y="428" width="28" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="288" y="428" width="28" height="5" rx="2.5" fill="#E2E8F0"/>
    <rect x="332" y="428" width="28" height="5" rx="2.5" fill="#E2E8F0"/>

    <!-- Promo strip -->
    <rect x="196" y="454" width="168" height="56" rx="16" fill="#F1F5F9"/>
    <rect x="196.5" y="454.5" width="167" height="55" rx="15.5" stroke="#E3E8F0"/>
    <circle cx="222" cy="482" r="14" fill="url(#zpAmber)"/>
    <path d="M223.5 474l-6 9h5l-1.5 7 6.5-10h-5z" fill="#FFFFFF"/>
    <rect x="246" y="472" width="90" height="7" rx="3.5" fill="#DDE3EE"/>
    <rect x="246" y="487" width="58" height="6" rx="3" fill="#E7ECF3"/>

    <!-- CTA -->
    <rect x="196" y="526" width="168" height="44" rx="22" fill="url(#zpBrand)"/>
    <text x="280" y="553" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">Repeat recharge</text>
    <rect x="258" y="580" width="44" height="5" rx="2.5" fill="#DDE3EE"/>
  </g>

  <!-- Floating: payment confirmed -->
  <g filter="url(#zpCard)">
    <rect x="18" y="198" width="198" height="86" rx="22" fill="#FFFFFF"/>
  </g>
  <circle cx="52" cy="241" r="20" fill="url(#zpMint)"/>
  <path d="M44.5 241.5l5 5 10-10" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="84" y="234" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" font-weight="500" fill="#0F172A">Bill paid</text>
  <text x="84" y="253" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="400" fill="#64748B">Electricity &#183; &#8377;1,240</text>

  <!-- Floating: instant badge -->
  <g filter="url(#zpCard)">
    <rect x="366" y="112" width="176" height="60" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="384" y="128" width="28" height="28" rx="9" fill="url(#zpBrand)"/>
  <path d="M400 133l-7 10h5l-2 8 8-11h-5z" fill="#FFFFFF"/>
  <rect x="424" y="132" width="98" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="424" y="148" width="62" height="6" rx="3" fill="#EDF1F6"/>

  <!-- Floating: activity card -->
  <g filter="url(#zpCard)">
    <rect x="344" y="416" width="200" height="118" rx="22" fill="#FFFFFF"/>
  </g>
  <rect x="368" y="436" width="76" height="8" rx="4" fill="#E2E8F0"/>
  <rect x="368" y="452" width="46" height="6" rx="3" fill="#EDF1F6"/>
  <rect x="368" y="482" width="14" height="26" rx="7" fill="#C7D2FE"/>
  <rect x="392" y="470" width="14" height="38" rx="7" fill="#A5B4FC"/>
  <rect x="416" y="490" width="14" height="18" rx="7" fill="#C7D2FE"/>
  <rect x="440" y="458" width="14" height="50" rx="7" fill="url(#zpBrand)"/>
  <rect x="464" y="476" width="14" height="32" rx="7" fill="#A5B4FC"/>
  <rect x="488" y="486" width="14" height="22" rx="7" fill="#C7D2FE"/>
  <circle cx="516" cy="443" r="10" fill="#ECFDF5"/>
  <path d="M512 443l3 3 5-6" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Floating coin -->
  <g filter="url(#zpCard)">
    <circle cx="92" cy="466" r="30" fill="url(#zpAmber)"/>
  </g>
  <text x="92" y="476" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="26" font-weight="500" fill="#FFFFFF">&#8377;</text>
</svg>
