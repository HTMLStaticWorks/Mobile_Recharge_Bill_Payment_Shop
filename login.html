<!DOCTYPE html>
<html lang="en" dir="ltr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ZapPay</title>
    <meta name="description" content="Login to your ZapPay account to manage bills and recharges.">
    <!-- CSS -->
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/rtl.css">
    <link rel="icon" type="image/svg+xml" href="assets/img/logo-mark.svg">
    <link rel="apple-touch-icon" href="assets/img/logo-mark.svg">
    <meta name="theme-color" content="#4F46E5">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <script>
      // Applied before first paint so a stored dark theme never flashes light.
      (function(){try{var t=localStorage.getItem("zappay_theme");var d=localStorage.getItem("zappay_dir");var e=document.documentElement;if(t==="dark"){e.setAttribute("data-theme","dark");}else{e.removeAttribute("data-theme");}if(d){e.setAttribute("dir",d);}e.classList.add("js");}catch(err){}})();
    </script>
    <!-- GA_TAG -->
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-tools">
            <button class="icon-btn theme-toggle" aria-label="Toggle Theme" title="Toggle Theme">
                <i data-lucide="moon"></i>
            </button>
            <button class="icon-btn rtl-toggle" aria-label="Toggle RTL" title="Toggle RTL">
                <i data-lucide="arrow-left-right"></i>
            </button>
        </div>
        <div class="auth-shell">
        <div class="auth-card">
            <a href="index.html" class="logo auth-logo">
                <img src="assets/img/logo-mark.svg" alt="" width="30" height="30"> ZapPay
            </a>

            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-sub">Sign in to manage your recharges, bills, and payment history.</p>

            <form class="validate-form" action="#" novalidate>
                <div class="form-group">
                    <label class="form-label" for="l_email">Email Address</label>
                    <input type="email" id="l_email" name="email" class="form-control" required autocomplete="email">
                    <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="l_password">Password</label>
                    <div class="field-password">
                        <input type="password" id="l_password" name="password" class="form-control" required autocomplete="current-password">
                        <button type="button" class="pw-toggle" data-pw-toggle="l_password" aria-label="Show password" aria-pressed="false">
                            <i data-lucide="eye"></i>
                        </button>
                        <div class="invalid-feedback">Please enter your password.</div>
                    </div>
                </div>

                <div class="auth-row auth-row-split">
                    <label class="check" for="l_remember">
                        <input type="checkbox" id="l_remember" name="remember"> Remember me
                    </label>
                    <a href="#">Forgot Password?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-auth">Login to Account</button>
            </form>

            <div class="auth-divider">or</div>

            <div class="social-auth">
                <button type="button" class="btn btn-social">
                    <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
                        <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
                        <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
                        <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
                    </svg>
                    Continue with Google
                </button>
                <button type="button" class="btn btn-social">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                        <path d="M12.152 6.896c-.948 0-2.415-1.078-3.96-1.04-2.04.027-3.91 1.183-4.961 3.014-2.117 3.675-.546 9.103 1.519 12.09 1.013 1.454 2.208 3.09 3.792 3.035 1.52-.065 2.09-.987 3.935-.987 1.831 0 2.35.987 3.96.948 1.637-.026 2.676-1.48 3.676-2.948 1.156-1.688 1.636-3.325 1.662-3.415-.039-.013-3.182-1.221-3.22-4.857-.026-3.04 2.48-4.494 2.597-4.559-1.429-2.09-3.623-2.324-4.39-2.376-2-.156-3.675 1.09-4.61 1.09zM15.53 3.83c.843-1.012 1.4-2.427 1.245-3.83-1.207.052-2.662.805-3.532 1.818-.78.896-1.454 2.338-1.273 3.714 1.338.104 2.715-.688 3.559-1.701"/>
                    </svg>
                    Continue with Apple
                </button>
            </div>

            <p class="auth-foot">Don't have an account? <a href="register.html">Register here</a></p>
            <p class="auth-note">
                <i data-lucide="lock"></i> Secured with 256-bit encryption
            </p>
        </div>
        </div>
    </main>

    <!-- Back to Top -->
    <a href="#top" class="back-to-top" aria-label="Back to top" title="Back to top">
        <i data-lucide="arrow-up"></i>
    </a>

    <!-- Scripts -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="assets/js/main.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>
</html>
